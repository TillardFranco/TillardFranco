<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">From idea to production</title>
  <style>
    .line { animation: rise 1s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }
  </style>
  <rect width="1200" height="300" fill="#161A22"/>
  <line x1="40.0" y1="0" x2="40.0" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="226.7" y1="0" x2="226.7" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="413.3" y1="0" x2="413.3" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="600.0" y1="0" x2="600.0" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="786.7" y1="0" x2="786.7" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="973.3" y1="0" x2="973.3" y2="300" stroke="rgba(232,233,236,0.07)"/><line x1="1160.0" y1="0" x2="1160.0" y2="300" stroke="rgba(232,233,236,0.07)"/>
  <g font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="84" fill="#E8E9EC">
    <text class="line" x="40" y="118" textLength="520" lengthAdjust="spacingAndGlyphs"><tspan fill="#7484FB">“</tspan>FROM IDEA</text>
    <text class="line" style="animation-delay:0.15s" x="226" y="204" textLength="740" lengthAdjust="spacingAndGlyphs">TO PRODUCTION<tspan fill="#7484FB">”</tspan></text>
  </g>
  <line x1="40" y1="238" x2="1160" y2="238" stroke="#9BA0AB" stroke-opacity="0.35"/>
  <text x="40" y="272" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#E8E9EC">Franco Tillard</text>
  <text x="1160" y="272" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace" font-size="13" letter-spacing="1.5" fill="#9BA0AB">FULLSTACK DEVELOPER</text>
</svg>
