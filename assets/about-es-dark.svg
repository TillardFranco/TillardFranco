l, sans-serif" font-size="14" fill="#131A2B">contra la base de datos real</text><text x="702.6666666666666" y="282" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#131A2B">antes de escribir código.</text>
